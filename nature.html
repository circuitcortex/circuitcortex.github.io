        <h2>陽明山國家公園</h2>
        <div class="flex-container">
            <div style="flex:1; min-width:300px; padding-right:20px;">
                <p>陽明山是台北的後花園，四季皆有不同風貌。春天賞櫻、夏天避暑、秋天賞芒、冬天泡湯。知名的景點包括小油坑、擎天崗大草原與竹子湖海芋田。</p>
                <p><strong>交通方式：</strong>搭乘捷運至劍潭站，轉乘紅5公車即可抵達。</p>
            </div>
            <div style="flex:1; min-width:300px;">
                <img src="images/yangmingshan.jpg" alt="陽明山" style="width:100%; border-radius:8px;">
            </div>
        </div>

        <h2>象山步道 (四獸山)</h2>
        <p>想要拍攝最美的台北 101 夜景，象山絕對是首選。步道完善，約 20-30 分鐘即可抵達六巨石觀景台。</p>
